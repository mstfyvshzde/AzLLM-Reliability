# Projenin nasıl build edileceğini tanımlar.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


# Projenin temel paket bilgileri.
[project]
name = "azllm-reliability"
version = "0.1.0"
description = "Controlled evaluation of Azerbaijani LLM capability and reliability."
requires-python = ">=3.10"

dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]


# setuptools'e hangi Python paketlerini projeye dahil edeceğini söyler.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


# pytest'in testleri nerede bulacağını ve import path ayarını tanımlar.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]