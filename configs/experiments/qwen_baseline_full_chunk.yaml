# Baseline experiment yapılandırması.
#
# Bu dosya model inference başlamadan önce deney protokolünü sabitler.
# Amaç hangi modelin, hangi benchmark split'i üzerinde, hangi generation
# ayarlarıyla değerlendirildiğini açık ve reproducible biçimde kaydetmektir.

experiment:
  # Deney için kısa ve sabit kimlik.
  name: baseline

  # Deney açıklaması.
  description: >
    Base modelin paired English-Azerbaijani benchmark üzerindeki capability
    ve reliability performansını adaptation uygulanmadan önce ölçer.

  # Reproducibility seed.
  seed: 17


languages:
  # Yüksek kaynaklı source language.
  source: en

  # Düşük kaynaklı target language.
  target: az


model:
  # Model ayarları ayrı config dosyasından yüklenir.
  config_path: configs/models/qwen2_5_7b_base.yaml


benchmark:
  # Baseline evaluation için kullanılacak benchmark split'i.
  #
  # Final research sonuçları için test split freeze edilmelidir.
  split: full

  # Pair-aware split pipeline tarafından üretilen input artifact.
  input_path: data/processed/final/benchmark_v1.0.jsonl

  # EN-AZ paired evaluation zorunlu.
  require_complete_pairs: true


generation:
  # Generation davranışı model config içinden alınır.
  #
  # Burada ayrıca override tanımlamıyoruz; tek source of truth
  # configs/models/qwen2_5_7b_base.yaml olarak korunur.
  use_model_config: true


inference:
  # Model prediction artifact'ı.
  output_path: outputs/qwen_baseline_full/chunk_900_999/predictions.jsonl

  # Var olan prediction artifact'ı varsayılan olarak overwrite edilmez.
  start_index: 900
  limit: 100

  overwrite: false


evaluation:
  # Inference sonrası evaluation artifact dizini.
  output_dir: outputs/qwen_baseline_full/chunk_900_999/evaluation

  # Capability evaluation.
  capability:
    enabled: true
    metric: task_aware
    paired_analysis: true

  # Reliability evaluation.
  reliability:
    enabled: true
    abstention_analysis: true
    paired_analysis: true

  # Existing evaluation artifact'ları varsayılan olarak korunur.
  overwrite: false


artifacts:
  # Run configuration snapshot kaydedilecek mi?
  save_config_snapshot: true

  # Experiment metadata kaydedilecek mi?
  save_run_metadata: true